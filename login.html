<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accès secrétaire</title><style>body{font:18px system-ui;background:#f2f2ef;color:#151515;margin:0}main{max-width:440px;margin:10vh auto;padding:28px;background:white;border-radius:18px}input,button{box-sizing:border-box;width:100%;font:inherit;padding:16px;margin:16px 0;border-radius:10px;border:1px solid #aaa}button{background:#183f73;color:white;cursor:pointer}p{line-height:1.5}#error{color:#9b3030}</style><main><h1>Console secrétaire</h1><p>Entrez le code d’accès affiché sur le Mac qui héberge la vente.</p><form><label for="pin">Code de la session</label><input id="pin" type="password" inputmode="numeric" autocomplete="off" required><button>Ouvrir la console</button></form><p id="error" role="status"></p></main><script src="/network.js"></script><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const button=document.querySelector('button');button.disabled=true;try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:document.getElementById('pin').value})});const d=await r.json();if(!r.ok)throw Error(d.error);location.replace('/')}catch(e){document.getElementById('error').textContent=e.message}finally{button.disabled=false}};</script></html>
